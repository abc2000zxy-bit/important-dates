name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Show Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          pip install cython==0.29.36 buildozer virtualenv
      - name: Build debug APK
        run: buildozer -v android debug
      - name: Verify manifest has receivers and boot permission
        run: |
          AAPT=$(find ~/.buildozer/android/platform/android-sdk/build-tools -name aapt | sort | tail -1)
          echo "Using $AAPT"
          "$AAPT" dump xmltree bin/*.apk AndroidManifest.xml > manifest.txt
          grep -q "org.importantdates.AlarmReceiver" manifest.txt || { echo "AlarmReceiver MISSING"; exit 1; }
          grep -q "org.importantdates.BootReceiver" manifest.txt || { echo "BootReceiver MISSING"; exit 1; }
          grep -q "android.permission.RECEIVE_BOOT_COMPLETED" manifest.txt || { echo "BOOT permission MISSING"; exit 1; }
          grep -q "android.intent.action.BOOT_COMPLETED" manifest.txt || { echo "BOOT_COMPLETED filter MISSING"; exit 1; }
          echo "Manifest OK"
      - uses: actions/upload-artifact@v4
        with:
          name: ImportantDates-apk
          path: |
            bin/*.apk
            manifest.txt
          if-no-files-found: error
